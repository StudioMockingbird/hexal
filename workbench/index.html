<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hexal Workbench</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111318;
      --panel: #1a1d24;
      --panel-alt: #15171d;
      --border: #303541;
      --text: #e6e9ef;
      --muted: #9aa3b2;
      --accent: #84a9ff;
      --good: #77d69b;
      --bad: #ff8e8e;
      --syntax-keyword: #c792ea;
      --syntax-type: #82aaff;
      --syntax-number: #f78c6c;
      --syntax-string: #c3e88d;
      --syntax-comment: #676e95;
      --syntax-punctuation: #89ddff;
      --syntax-constant: #ffcb6b;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; }
    main { width: min(1500px, 100%); margin: 0 auto; padding: 24px; }
    header, .section-heading, .source-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    header { align-items: baseline; margin-bottom: 18px; }
    h1, h2 { margin: 0; font-weight: 600; }
    h1 { font-size: 20px; }
    h2 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .hint, .description { color: var(--muted); font-size: 12px; }
    .description { min-height: 18px; margin: 8px 0 0; }

    .editor-panel, .output-panel, .stats-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .editor-panel { margin-bottom: 16px; }
    .snippet-selectors { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    select, input[type="text"], textarea, pre {
      width: 100%; border: 1px solid var(--border); border-radius: 5px;
      background: var(--panel-alt); color: var(--text); font: inherit;
    }
    select, input[type="text"] { min-height: 38px; padding: 8px 10px; outline: none; }
    select:focus, input[type="text"]:focus, textarea:focus { border-color: var(--accent); }

    .sources { display: grid; gap: 12px; margin-top: 14px; }
    .source-card { border: 1px solid var(--border); border-radius: 7px; background: var(--panel-alt); padding: 12px; }
    .source-heading { align-items: center; }
    .source-name { max-width: 440px; margin-right: auto; }
    .entrypoint-label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
    input[type="radio"], input[type="checkbox"] { accent-color: var(--accent); }
    .source-editor { position: relative; min-height: 150px; margin-top: 10px; }
    .source-highlight, .source-editor textarea {
      min-height: 150px; margin: 0; padding: 12px; line-height: 1.45;
      white-space: pre-wrap; overflow-wrap: break-word;
    }
    .source-highlight { position: absolute; inset: 0; overflow: auto; pointer-events: none; }
    .source-editor textarea {
      position: relative; z-index: 1; resize: vertical; outline: none;
      background: transparent; color: transparent; caret-color: var(--text);
      -webkit-text-fill-color: transparent;
    }
    .source-editor textarea::selection { background: rgba(132, 169, 255, .25); }

    .syntax-keyword { color: var(--syntax-keyword); }
    .syntax-type { color: var(--syntax-type); }
    .syntax-number { color: var(--syntax-number); }
    .syntax-string { color: var(--syntax-string); }
    .syntax-comment { color: var(--syntax-comment); }
    .syntax-punctuation { color: var(--syntax-punctuation); }
    .syntax-constant { color: var(--syntax-constant); }

    button {
      margin-top: 12px; border: 0; border-radius: 5px; padding: 8px 14px;
      background: var(--accent); color: #10131a; cursor: pointer; font: inherit; font-weight: 700;
    }
    button.secondary { margin-top: 0; background: #30394b; color: var(--text); }
    button.remove { margin-top: 0; padding: 6px 10px; background: transparent; color: var(--bad); border: 1px solid #61343a; }
    button:disabled { opacity: .6; cursor: wait; }
    .actions { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .actions button { margin-top: 0; }
    .status { color: var(--muted); }
    .status.good { color: var(--good); }
    .status.bad { color: var(--bad); }

    .mapping-toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); cursor: pointer; user-select: none; }
    .generated-files { display: grid; gap: 10px; margin-top: 12px; }
    details { border: 1px solid var(--border); border-radius: 6px; background: var(--panel-alt); overflow: hidden; }
    summary { padding: 10px 12px; cursor: pointer; color: var(--accent); font-weight: 700; }
    details pre { min-height: 140px; margin: 0; border: 0; border-top: 1px solid var(--border); border-radius: 0; padding: 12px; overflow: auto; white-space: pre-wrap; }
    .error-panel { border-color: #6a3038; background: #24181c; }
    .error-panel pre { min-height: 100px; margin: 12px 0 0; padding: 12px; color: var(--bad); white-space: pre-wrap; }
    .stats-panel { margin-top: 16px; }
    .stats-output { min-height: 150px; margin: 12px 0 0; padding: 12px; white-space: pre; }
    [hidden] { display: none !important; }

    @media (max-width: 800px) {
      main { padding: 14px; }
      header, .source-heading { align-items: stretch; flex-direction: column; }
      .hint { margin-top: 6px; }
      .snippet-selectors { grid-template-columns: 1fr; }
      .source-name { max-width: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Hexal Workbench</h1>
      <span class="hint">Ctrl+Enter to compile</span>
    </header>

    <section class="editor-panel">
      <div class="section-heading">
        <h2>Program</h2>
        <button id="add-source" class="secondary" type="button">Add source file</button>
      </div>
      <div class="snippet-selectors">
        <select id="snippet-category" aria-label="Snippet category">
          <option value="">Choose a category...</option>
        </select>
        <select id="snippet-tag" aria-label="Feature tag filter" disabled>
          <option value="">All features</option>
        </select>
        <select id="snippet" aria-label="Language snippet" disabled>
          <option value="">Choose a snippet...</option>
        </select>
      </div>
      <p id="snippet-description" class="description"></p>
      <div id="sources" class="sources"></div>
      <div class="actions">
        <button id="compile" type="button">Compile</button>
        <span id="status" class="status">Loading snippets...</span>
      </div>
    </section>

    <section id="files" class="output-panel" hidden>
      <div class="section-heading">
        <h2>Generated files</h2>
        <label class="mapping-toggle">
          <input id="show-line-mappings" type="checkbox" checked>
          Show #line mappings
        </label>
      </div>
      <div id="generated-files" class="generated-files"></div>
    </section>

    <section id="errors" class="output-panel error-panel" hidden>
      <h2>std.err</h2>
      <pre id="stderr"></pre>
    </section>

    <section class="stats-panel">
      <h2>Project compilation stats</h2>
      <pre id="stats-output" class="stats-output">Compile to see stats.</pre>
    </section>
  </main>

  <script>
    const categorySelect = document.querySelector('#snippet-category');
    const tagSelect = document.querySelector('#snippet-tag');
    const snippetSelect = document.querySelector('#snippet');
    const snippetDescription = document.querySelector('#snippet-description');
    const sourceList = document.querySelector('#sources');
    const addSourceButton = document.querySelector('#add-source');
    const compileButton = document.querySelector('#compile');
    const filesPanel = document.querySelector('#files');
    const generatedFilesElement = document.querySelector('#generated-files');
    const errorsPanel = document.querySelector('#errors');
    const stderr = document.querySelector('#stderr');
    const status = document.querySelector('#status');
    const statsOutput = document.querySelector('#stats-output');
    const showLineMappings = document.querySelector('#show-line-mappings');

    let catalog = [];
    let generatedFiles = {};
    let openGeneratedFiles = new Set();

    function escapeHTML(value) {
      return value.replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[character]));
    }

    function highlightedTokens(value, pattern, classify) {
      let output = '';
      let cursor = 0;
      for (const match of value.matchAll(pattern)) {
        output += escapeHTML(value.slice(cursor, match.index));
        const token = match[0];
        const className = classify(token);
        output += className ? `<span class="${className}">${escapeHTML(token)}</span>` : escapeHTML(token);
        cursor = match.index + token.length;
      }
      return output + escapeHTML(value.slice(cursor));
    }

    function highlightHexal(value) {
      const pattern = /--\[[\s\S]*?\]--|---[^\n]*|--[^\n]*|b'(?:\\.|[^'\\])'|'(?:\\.|[^'\\])'|"(?:\\.|[^"\\])*"|0[xX][0-9A-Fa-f_]+|0[bB][01_]+|0[oO][0-7_]+|\d[\d_]*(?:\.[\d_]+)?(?:[eE][+-]?[\d_]+)?|\b(?:module|import|export|true|false|nil|eos|mut|ref|type|and|or|is|fun|impl|end|return|if|elseif|else|while|break|continue|defer|try|errdefer|spawn|as|match|then|self|for|in|do)\b|\b(?:UInt8|UInt16|UInt32|UInt64|Int8|Int16|Int32|Int64|Float32|Float64|Bool|Size|Byte|Rune|String|Strand|Nil|EoS|Error|Unknown|Heap|Array|View|List|Dict|Stream|Task|Channel|Mutex|Atomic|File|FileMode|Stdio|Ptr|MutPtr|Fun)\b|!=|==|<=|>=|<<|>>|[{}\[\]:,=<>.!+\-*\/%()|&^~]|\b[A-Za-z][A-Za-z0-9_]*\b/g;
      return highlightedTokens(value, pattern, token => {
        if (/^--/.test(token)) return 'syntax-comment';
        if (/^(?:b?'|\")/.test(token)) return 'syntax-string';
        if (/^0[xXbBoO]|^\d/.test(token)) return 'syntax-number';
        if (/^(module|import|export|true|false|nil|eos|mut|ref|type|and|or|is|fun|impl|end|return|if|elseif|else|while|break|continue|defer|try|errdefer|spawn|as|match|then|self|for|in|do)$/.test(token)) return 'syntax-keyword';
        if (/^(UInt8|UInt16|UInt32|UInt64|Int8|Int16|Int32|Int64|Float32|Float64|Bool|Size|Byte|Rune|String|Strand|Nil|EoS|Error|Unknown|Heap|Array|View|List|Dict|Stream|Task|Channel|Mutex|Atomic|File|FileMode|Stdio|Ptr|MutPtr|Fun)$/.test(token)) return 'syntax-type';
        if (/^(?:!=|==|<=|>=|<<|>>|[{}\[\]:,=<>.!+\-*\/%()|&^~])$/.test(token)) return 'syntax-punctuation';
        return '';
      });
    }

    function highlightC(value) {
      const pattern = /\/\/[^\n]*|\/\*[\s\S]*?\*\/|#[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b(?:uint8_t|uint16_t|uint32_t|uint64_t|int8_t|int16_t|int32_t|int64_t|float|double|size_t|bool|void)\b|\b(?:int|return|static|struct|typedef|if|else|const|enum)\b|\b(?:EXIT_SUCCESS|EXIT_FAILURE|NULL|stderr|stdout)\b|\b(?:0[xX][0-9A-Fa-f_]+|\d[\d_]*(?:\.[\d_]*)?)\b|[{}()\[\];,.*=<>:+-]|\b[A-Za-z_][A-Za-z0-9_]*\b/g;
      return highlightedTokens(value, pattern, token => {
        if (/^\/\//.test(token) || /^\/\*/.test(token)) return 'syntax-comment';
        if (/^#/.test(token)) return 'syntax-keyword';
        if (/^["']/.test(token)) return 'syntax-string';
        if (/^(uint8_t|uint16_t|uint32_t|uint64_t|int8_t|int16_t|int32_t|int64_t|float|double|size_t|bool|void)$/.test(token)) return 'syntax-type';
        if (/^(int|return|static|struct|typedef|if|else|const|enum)$/.test(token)) return 'syntax-keyword';
        if (/^(EXIT_SUCCESS|EXIT_FAILURE|NULL|stderr|stdout)$/.test(token)) return 'syntax-constant';
        if (/^(0x|\d)/.test(token)) return 'syntax-number';
        if (/^[{}()\[\];,.*=<>:+-]$/.test(token)) return 'syntax-punctuation';
        return '';
      });
    }

    function sourceCards() {
      return [...sourceList.querySelectorAll('.source-card')];
    }

    function nextSourceName() {
      const used = new Set(sourceCards().map(card => card.querySelector('.source-name').value));
      let index = sourceCards().length + 1;
      while (used.has(`module${index}.hex`)) index++;
      return `module${index}.hex`;
    }

    function addSource(filename = '', content = '', entrypoint = false) {
      const card = document.createElement('section');
      card.className = 'source-card';
      card.innerHTML = `
        <div class="source-heading">
          <input class="source-name" type="text" aria-label="Logical source filename" value="${escapeHTML(filename || nextSourceName())}">
          <label class="entrypoint-label"><input class="entrypoint" type="radio" name="entrypoint" ${entrypoint ? 'checked' : ''}> Entrypoint</label>
          <button class="remove" type="button" aria-label="Remove source file">Remove</button>
        </div>
        <div class="source-editor">
          <pre class="source-highlight" aria-hidden="true"></pre>
          <textarea spellcheck="false" aria-label="Hexal source"></textarea>
        </div>`;
      const textarea = card.querySelector('textarea');
      const highlight = card.querySelector('.source-highlight');
      textarea.value = content;
      const update = () => {
        highlight.innerHTML = highlightHexal(textarea.value) || ' ';
        highlight.scrollTop = textarea.scrollTop;
        highlight.scrollLeft = textarea.scrollLeft;
      };
      textarea.addEventListener('input', update);
      textarea.addEventListener('scroll', update);
      card.querySelector('.remove').addEventListener('click', () => {
        const wasEntrypoint = card.querySelector('.entrypoint').checked;
        card.remove();
        if (sourceCards().length === 0) addSource('app.hex', '', true);
        else if (wasEntrypoint) sourceCards()[0].querySelector('.entrypoint').checked = true;
      });
      sourceList.append(card);
      if (!sourceList.querySelector('.entrypoint:checked')) card.querySelector('.entrypoint').checked = true;
      update();
      return card;
    }

    function replaceSources(sources, entrypoint) {
      sourceList.replaceChildren();
      const names = Object.keys(sources).sort((left, right) => {
        if (left === entrypoint) return -1;
        if (right === entrypoint) return 1;
        return left.localeCompare(right);
      });
      for (const name of names) addSource(name, sources[name], name === entrypoint);
    }

    function selectedCategory() {
      return catalog.find(category => category.id === categorySelect.value);
    }

    function populateSnippets() {
      const category = selectedCategory();
      const tag = tagSelect.value;
      snippetSelect.replaceChildren(new Option('Choose a snippet...', ''));
      snippetSelect.disabled = !category;
      snippetDescription.textContent = '';
      if (!category) return;
      for (const snippet of category.snippets) {
        if (tag && !snippet.features.includes(tag)) continue;
        snippetSelect.append(new Option(snippet.name, snippet.id));
      }
    }

    function selectedSnippet() {
      const category = selectedCategory();
      return category && category.snippets.find(snippet => snippet.id === snippetSelect.value);
    }

    async function loadCatalog() {
      try {
        const response = await fetch('/api/snippets');
        if (!response.ok) throw new Error(`snippet request failed (${response.status})`);
        catalog = await response.json();
        for (const category of catalog) categorySelect.append(new Option(category.name, category.id));
        const tags = new Set();
        for (const category of catalog) {
          for (const snippet of category.snippets) {
            for (const feature of snippet.features) tags.add(feature);
          }
        }
        for (const tag of [...tags].sort()) tagSelect.append(new Option(tag, tag));
        tagSelect.disabled = false;
        status.textContent = 'Ready';
      } catch (error) {
        status.className = 'status bad';
        status.textContent = 'Could not load snippets';
        snippetDescription.textContent = error.message;
      }
    }

    function collectProgram() {
      const sources = {};
      let entrypoint = '';
      for (const card of sourceCards()) {
        const name = card.querySelector('.source-name').value.trim();
        if (!name) throw new Error('Every source file needs a logical filename.');
        if (Object.hasOwn(sources, name)) throw new Error(`Duplicate source filename: ${name}`);
        sources[name] = card.querySelector('textarea').value;
        if (card.querySelector('.entrypoint').checked) entrypoint = name;
      }
      if (!entrypoint) throw new Error('Choose one entrypoint source file.');
      return {sources, entrypoint};
    }

    async function compile() {
      compileButton.disabled = true;
      status.className = 'status';
      status.textContent = 'Compiling...';
      try {
        const program = collectProgram();
        const response = await fetch('/api/compile', {
          method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(program)
        });
        const result = await response.json();
        render(result);
      } catch (error) {
        render({exitCode: 1, stderr: ['workbench: ' + error.message], stats: {tokenCount: 0, sourceLines: 0, phases: []}});
      } finally {
        compileButton.disabled = false;
      }
    }

    function render(result) {
      const failed = result.stderr && result.stderr.length > 0;
      filesPanel.hidden = failed;
      errorsPanel.hidden = !failed;
      if (failed) {
        generatedFiles = {};
        generatedFilesElement.replaceChildren();
        stderr.textContent = result.stderr.join('\n');
        status.className = 'status bad';
        status.textContent = 'Compilation failed';
      } else {
        generatedFiles = result.files || {};
        openGeneratedFiles = new Set(Object.hasOwn(generatedFiles, 'main.c') ? ['main.c'] : []);
        renderGeneratedFiles();
        status.className = 'status good';
        status.textContent = `Compilation succeeded - ${Object.keys(generatedFiles).length} files`;
      }
      renderStats(result.stats || {tokenCount: 0, sourceLines: 0, phases: []});
    }

    function renderGeneratedFiles() {
      const names = Object.keys(generatedFiles).sort();
      generatedFilesElement.replaceChildren();
      for (const name of names) {
        const details = document.createElement('details');
        details.open = openGeneratedFiles.has(name);
        const summary = document.createElement('summary');
        summary.textContent = name;
        const output = document.createElement('pre');
        const raw = generatedFiles[name] || '';
        output.innerHTML = highlightC(showLineMappings.checked ? raw : withoutLineMappings(raw));
        details.append(summary, output);
        details.addEventListener('toggle', () => {
          if (details.open) openGeneratedFiles.add(name);
          else openGeneratedFiles.delete(name);
        });
        generatedFilesElement.append(details);
      }
    }

    function withoutLineMappings(value) {
      return value.replace(/^#line[^\n]*(?:\n|$)/gm, '');
    }

    function renderStats(stats) {
      const lines = [
        `Sources:              ${sourceCards().length}`,
        `Source lines:         ${Number(stats.sourceLines || 0)}`,
        `Tokens:               ${Number(stats.tokenCount || 0)}`,
        '',
        '--- Phase timings ---'
      ];
      for (const phase of stats.phases || []) {
        const detail = phase.detail ? `   (${phase.detail})` : '';
        lines.push(`${phase.name.padEnd(22)} ${Number(phase.milliseconds || 0).toFixed(2).padStart(7)} ms${detail}`);
      }
      lines.push('---------------------------------------------------');
      lines.push(`Total time:           ${Number(stats.totalMs || 0).toFixed(2).padStart(7)} ms`);
      statsOutput.textContent = lines.join('\n');
    }

    categorySelect.addEventListener('change', populateSnippets);
    tagSelect.addEventListener('change', populateSnippets);
    snippetSelect.addEventListener('change', () => {
      const snippet = selectedSnippet();
      if (!snippet) return;
      snippetDescription.textContent = snippet.description || '';
      replaceSources(snippet.sources, snippet.entrypoint);
      compile();
    });
    addSourceButton.addEventListener('click', () => addSource());
    compileButton.addEventListener('click', compile);
    showLineMappings.addEventListener('change', renderGeneratedFiles);
    sourceList.addEventListener('keydown', event => {
      if (event.ctrlKey && event.key === 'Enter') {
        event.preventDefault();
        compile();
      }
    });

    addSource('app.hex', 'x: Int32 = 13\n', true);
    loadCatalog();
  </script>
</body>
</html>
